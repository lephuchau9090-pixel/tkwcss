<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>2.1.1 - Sử dụng CSS</title>

  <style>
    body {
      background-color: lightblue;
      font-family: Arial, sans-serif;
    }
    .mau1 h1 {
      color: white;
      text-align: center;
    }
    .mau1 p {
      font-family: Verdana, sans-serif;

      margin: 32px 0;
      border: 1px dashed #666;

  <div class="mau1">
    <h1>My First CSS Example</h1>
    <p>This is paragraph</p>
  </div>

</html>
