<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Rectangles</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: Arial, sans-serif;
      padding: 24px;
    }
    .outside-div {
      border: 4px dotted blue;
      border-radius: 16px;
      padding: 18px;
      max-width: 520px;
    }
    .middle-div {
      border: 4px dashed red;
      border-radius: 14px;
      padding: 18px;
    }
    .inner-div {
      border: 4px solid green;
      border-radius: 12px;
      padding: 22px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="outside-div">
    <div class="middle-div">
      <div class="inner-div">
        I am heavily packed &lt;DIV&gt;
      </div>
    </div>
  </div>
</body>
</html>
