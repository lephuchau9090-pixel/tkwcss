<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>2.1.2 - The border-style Property</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    p {
      margin: 8px 0;
      padding: 4px 8px;
    }
    p.dotted { border-style: dotted; border-color: red; }
    p.dashed { border-style: dashed; border-color: green; }
    p.solid  { border-style: solid;  border-color: blue; }
    p.double { border-style: double; border-color: purple; }
    p.groove { border-style: groove; border-color: pink; }
    p.ridge  { border-style: ridge;  border-color: orange; }
    p.inset  { border-style: inset;  border-color: brown; }
    p.outset { border-style: outset; border-color: teal; }
    p.none   { border-style: none; }
    p.hidden { border-style: hidden; }
    p.mix    { border-style: dotted dashed solid double; }
  </style>
</head>
<body>
  <h2>The border-style Property</h2>
  <p>This property specifies what kind of border to display:</p>

  <p class="dotted">A dotted border.</p>
  <p class="dashed">A dashed border.</p>
  <p class="solid">A solid border.</p>
  <p class="double">A double border.</p>
  <p class="groove">A groove border.</p>
  <p class="ridge">A ridge border.</p>
  <p class="inset">An inset border.</p>
  <p class="outset">An outset border.</p>
  <p class="none">No border.</p>
  <p class="hidden">A hidden border.</p>
  <p class="mix">A mixed border.</p>
</body>
</html>
